name: Continuous Integration (CI)

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging, dev ]

jobs:
  lint:
    name: 🧹 Code Linting & Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

  unit-tests:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: pytest tests/

  data-checks:
    name: 📊 Data Schema & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pandas
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Create Sample Data & Verify Schema
        run: |
          python -c "
          import os, sys
          import pandas as pd

          # Ensure data/raw directory exists (cross-platform)
          raw_dir = os.path.join('data', 'raw')
          os.makedirs(raw_dir, exist_ok=True)
          data_path = os.path.join(raw_dir, 'WA_Fn-UseC_-Telco-Customer-Churn.csv')

          # If raw CSV is missing in CI (due to DVC ignore), create a small sample for validation
          if not os.path.exists(data_path):
              print('Creating sample dataset for CI validation...')
              sample_df = pd.DataFrame({
                  'customerID': [f'ID_{i}' for i in range(100)],
                  'gender': ['Male', 'Female'] * 50,
                  'SeniorCitizen': [0, 1] * 50,
                  'Partner': ['Yes', 'No'] * 50,
                  'Dependents': ['No', 'Yes'] * 50,
                  'tenure': list(range(100)),
                  'PhoneService': ['Yes'] * 100,
                  'MultipleLines': ['No'] * 100,
                  'InternetService': ['DSL', 'Fiber optic'] * 50,
                  'OnlineSecurity': ['No'] * 100,
                  'OnlineBackup': ['Yes'] * 100,
                  'DeviceProtection': ['No'] * 100,
                  'TechSupport': ['No'] * 100,
                  'StreamingTV': ['Yes'] * 100,
                  'StreamingMovies': ['No'] * 100,
                  'Contract': ['Month-to-month'] * 100,
                  'PaperlessBilling': ['Yes'] * 100,
                  'PaymentMethod': ['Electronic check'] * 100,
                  'MonthlyCharges': [70.35] * 100,
                  'TotalCharges': ['70.35'] * 100,
                  'Churn': ['No', 'Yes'] * 50
              })
              sample_df.to_csv(data_path, index=False)

          df = pd.read_csv(data_path)
          print(f'Data checks passed! Rows: {len(df)}, Cols: {len(df.columns)}')

          # Check essential columns exist
          required_cols = ['customerID', 'gender', 'Churn']
          missing = [col for col in required_cols if col not in df.columns]
          if missing:
              print(f'CRITICAL: Missing columns: {missing}')
              sys.exit(1)
          "

  smoke-train:
    name: ⚡ End-to-End Smoke Training Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Training
        run: python src/train.py
