stages:
  prepare:
    cmd: python -m src.prepare
    deps:
      - src/prepare.py
      - src/cleaning.py
      - data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
    params:
      - seed
      - split.test_size
    outs:
      - data/prepared/train.csv
      - data/prepared/test.csv

  train:
    cmd: python -m src.train
    deps:
      - src/train.py
      - data/prepared/train.csv
    params:
      - seed
      - train
    outs:
      - models/model.joblib

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - models/model.joblib
      - data/prepared/test.csv
    params:
      - seed
    metrics:
      - metrics.json:
          cache: false
